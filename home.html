<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startseite – Spielauswahl</title>
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <div class="container">
    <h1>🎮 Wähle ein Spiel</h1>

    <div class="game-grid">
      <div class="game-card" onclick="window.location.href='blocks.html'">
        <h2>🟦 Blocks</h2>
        <p>Teste deine Reaktionsgeschwindigkeit!</p>
      </div>

      <div class="game-card" onclick="window.location.href='reaction.html'">
        <h2>⚡ Reaktion</h2>
        <p>Wie schnell kannst du reagieren?</p>
      </div>

      <div class="game-card" onclick="window.location.href='puzzle.html'">
        <h2>🧩 Puzzle</h2>
        <p>Setze das Bild richtig zusammen!</p>
      </div>
    </div>

     <!--  Musik -->
  <audio id="bg-music" src="musik/spiel-hintergrund.mp3" loop></audio>
  <button id="music-toggle">🎵 Musik einschalten</button>

  <script>
    const music = document.getElementById("bg-music");
    const toggle = document.getElementById("music-toggle");
    let musicEnabled = false;

    // Musik erst starten, wenn der Nutzer einmal klickt (Browser-Sicherheitsregel)
    const enableMusic = () => {
      if (!musicEnabled) {
        music.play().then(() => {
          musicEnabled = true;
          toggle.textContent = "🔊 Musik aus";
        }).catch(() => {
          console.log("Musik konnte nicht automatisch gestartet werden.");
        });
      }
    };

    // Klick-Event für Button
    toggle.addEventListener("click", () => {
      if (music.paused) {
        music.play();
        toggle.textContent = "🔊 Musik aus";
      } else {
        music.pause();
        toggle.textContent = "🎵 Musik an";
      }
    });

    // Musik aktivieren bei erstem Klick oder Touch auf die Seite
    document.body.addEventListener("click", enableMusic, { once: true });
    document.body.addEventListener("touchstart", enableMusic, { once: true });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block-Spiel</title>
  <link rel="stylesheet" href="css/blocks.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div id="gameWrapper">
    <h1>🟦 Block-Runner</h1>
    <div id="gameArea">
      <div id="player"></div>
    </div>

    <h2 id="statusText">Weiche den fallenden Blöcken aus!</h2>
    <button onclick="restartGame()">🔁 Neu starten</button>
    <a href="home.html" class="back">⬅ Zurück zum Menü</a>
  </div>



<div id="siteHeader"></div>

<script>
  // header.html in die Seite laden
  fetch("header.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("siteHeader").innerHTML = data;
    });
</script>



  <script src="js/blocks.js"></script>



<!-- Musik -->
<audio id="bg-music" src="musik/spiel-hintergrund.mp3" loop></audio>
<button id="music-toggle">🎵 Musik einschalten</button>

<script>
  const music = document.getElementById("bg-music");
  const toggle = document.getElementById("music-toggle");
  let musicEnabled = false;

  const enableMusic = () => {
    if (!musicEnabled) {
      music.play().then(() => {
        musicEnabled = true;
        toggle.textContent = "🔊 Musik aus";
      }).catch(() => {
        console.log("Musik konnte nicht automatisch gestartet werden.");
      });
    }
  };

  toggle.addEventListener("click", () => {
    if (music.paused) {
      music.play();
      toggle.textContent = "🔊 Musik aus";
    } else {
      music.pause();
      toggle.textContent = "🎵 Musik an";
    }
  });

  document.body.addEventListener("click", enableMusic, { once: true });
  document.body.addEventListener("touchstart", enableMusic, { once: true });
</script>




</body>
</html>
